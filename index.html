<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategori Vitrini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="../" class="font-bold text-slate-900 flex items-center gap-2 hover:text-amber-600 transition-colors text-sm">
                <i class="fa-solid fa-arrow-left"></i> Ana Rehbere Dön
            </a>
            <span id="header-badge" class="text-xs font-semibold px-3 py-1 bg-amber-50 text-amber-700 rounded-full">Kategori Rehberi</span>
        </div>
    </header>
    <main class="max-w-6xl mx-auto px-4 py-10">
        <div class="mb-10 text-center md:text-left">
            <h1 id="page-title" class="text-3xl font-extrabold text-slate-900">Yükleniyor...</h1>
            <p id="page-desc" class="text-slate-600 mt-2 text-base">Detaylı mekan listesi yükleniyor.</p>
        </div>
        <div id="items-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
